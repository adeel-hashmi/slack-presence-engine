<!DOCTYPE html>
<html>

<head>
    <title>Slack Presence Engine</title>
    <style>
        body {
            width: 200px;
            font-family: sans-serif;
            padding: 15px;
            text-align: center;
        }

        h2 {
            font-size: 16px;
            color: #4A154B;
            margin-bottom: 10px;
        }

        .status-box {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            font-weight: bold;
        }

        .on {
            background: #d1fadf;
            color: #027a48;
        }

        .off {
            background: #fee4e2;
            color: #b42318;
        }

        button {
            width: 100%;
            padding: 10px;
            cursor: pointer;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
    </style>
</head>

<body>
    <h2>Presence Engine</h2>
    <div id="statusDiv" class="status-box on">Engine: ACTIVE</div>
    <button id="toggleBtn">Pause Engine</button>
    <script src="popup.js"></script>
</body>

</html>
